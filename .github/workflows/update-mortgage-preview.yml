name: Update mortgage link preview
on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python .github/scripts/update_mortgage_preview.py
      - name: Save today's image and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/Henry_Yue_Mortgage_Planner.html public/mortgage-share-cover.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update mortgage link preview'
            git push
          fi
